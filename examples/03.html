<!doctype html>              <!-- ① 이 문서는 HTML5입니다 -->
<!--
2주차 예제 3 — HTML 문서의 뼈대
-->
<html lang="ko">             <!-- ② 문서 전체를 감싸며, 언어는 한국어 -->
<head>                       <!-- ③ 화면에 안 보이는 정보 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 페이지</title>
</head>
<body>                       <!-- ④ 화면에 보이는 내용 -->
  <h1>여기부터 보입니다</h1>
</body>
</html>
