<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2주차 예제 2 · 올바른 중첩과 잘못된 중첩</title>
</head>
<body>
  <!--
  2주차 예제 2 — 올바른 중첩과 잘못된 중첩
  -->
  <!-- ✅ 올바름 — 나중에 연 것을 먼저 닫는다 -->
  <p>이것은 <strong>중요한</strong> 문장입니다.</p>

  <!-- ❌ 틀림 — 태그가 서로 엇갈렸다 -->
  <p>이것은 <strong>중요한</p></strong>

  <!-- 양말을 신고 신발을 신었으면, 신발을 먼저 벗어야 하는 것과 같습니다. -->
</body>
</html>
