<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2주차 예제 7 · 중첩 목록 — li 안에 ul을 넣습니다</title>
</head>
<body>
  <!--
  2주차 예제 7 — 중첩 목록 — li 안에 ul을 넣습니다
  -->
  <ul>
    <li>프론트엔드
      <ul>
        <li>HTML</li>
        <li>CSS</li>
      </ul>
    </li>
    <li>백엔드</li>
  </ul>

  <!-- ❌ 흔한 실수: ul 바로 아래에 ul을 넣는 것 -->
  <!-- ul의 자식은 li만 올 수 있습니다. -->
</body>
</html>
